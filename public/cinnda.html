<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CINNDA — Home</title>

  <style>
    :root{
      --bg: #ffffff;
      --ink: #111111;
      --muted: #6b6b6b;
      --card-radius: 22px;
      --gap: 22px;

      --mint: #62d3b4;
      --blue: #2f34ff;
      --shadow: 0 10px 22px rgba(0,0,0,.08);
      --shadow-soft: 0 6px 14px rgba(0,0,0,.07);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: var(--bg);
      color: var(--ink);
    }

    /* Hero: full viewport width & height */
    .frame{
      min-height: 100vh;
      width: 100%;
      padding: 0;
    }
    .wrap{
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0 22px 36px;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 20px 4px 10px;
      gap: 16px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 210px;
    }
    .brand-logo{
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: #000;
      display:grid;
      place-items:center;
      color:#fff;
      font-weight:700;
      letter-spacing:.5px;
    }
    .brand-text{
      font-size: 12px;
      line-height: 1.1;
      font-weight: 600;
      text-transform: lowercase;
    }

    nav ul{
      list-style:none;
      display:flex;
      gap: 34px;
      padding:0;
      margin:0;
      align-items:center;
    }
    nav a{
      text-decoration:none;
      color:#222;
      font-size: 16px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 500;
    }
    nav a:hover{ opacity:.7; }

    /* Grid */
    .grid{
      display:grid;
      gap: var(--gap);
      margin-top: 10px;
      flex: 1;
      min-height: 0;
    }

    /* Desktop layout */
    @media (min-width: 980px){
      .grid{
        grid-template-columns: repeat(12, 1fr);
        grid-auto-rows: minmax(92px, 1fr); /* fill hero height */
      }
      .c1{ grid-column: 1 / span 5; grid-row: 1 / span 3; } /* Smart City */
      .c2{ grid-column: 6 / span 2; grid-row: 1 / span 3; } /* tall image */
      .c3{ grid-column: 8 / span 1; grid-row: 1 / span 3; } /* blue small */
      .c4{ grid-column: 9 / span 4; grid-row: 1 / span 3; }/* Aeroespacial */

      .c5{ grid-column: 1 / span 3; grid-row: 4 / span 2; } /* left image */
      .c6{ grid-column: 4 / span 2; grid-row: 4 / span 2; } /* Edu */
      .c7{ grid-column: 6 / span 3; grid-row: 4 / span 2; } /* street */
      .c8{ grid-column: 9 / span 2; grid-row: 4 / span 2; } /* IA */
      .c9{ grid-column: 11 / span 2; grid-row: 4 / span 2; } /* map */

      .c10{ grid-column: 1 / span 6; grid-row: 6 / span 2; } /* bottom left big image */
      .c11{ grid-column: 7 / span 6; grid-row: 6 / span 2; } /* info block */
    }

    /* Mobile/tablet: stack nicely */
    @media (max-width: 979px){
      .grid{
        grid-template-columns: 1fr;
      }
      .header{
        flex-wrap:wrap;
      }
      nav ul{
        gap: 18px;
        flex-wrap:wrap;
        justify-content:flex-start;
      }
      .wrap{ padding: 0 16px 28px; }
    }

    .card{
      border-radius: var(--card-radius);
      overflow:hidden;
      box-shadow: var(--shadow-soft);
      position:relative;
      min-height: 160px;
      background:#f6f6f6;
    }
    .card--solid{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px;
      color: #fff;
      text-align:center;
    }
    .card--mint{ background: var(--mint); }
    .card--blue{ background: var(--blue); }

    .card__title{
      font-size: clamp(22px, 2.6vw, 40px);
      font-weight: 700;
      letter-spacing:.01em;
      text-shadow: 0 1px 0 rgba(0,0,0,.06);
    }
    .card__title.small{
      font-size: clamp(20px, 2.0vw, 32px);
    }

    .card--img{
      background-size: cover;
      background-position: center;
    }
    .card--img::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(to top, rgba(0,0,0,.18), rgba(0,0,0,0) 55%);
      pointer-events:none;
    }

    /* Bottom info block */
    .info{
      background:#fff;
      box-shadow:none;
      border-radius: var(--card-radius);
      padding: 46px 58px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap: 10px;
      border: 1px solid #f0f0f0;
    }
    .info .email{
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .info p{
      margin:0;
      color:#222;
      max-width: 520px;
      line-height: 1.45;
      font-size: 16px;
    }

    /* Small label like "HOME" top-left of dark background (optional) */
    .top-label{
      max-width: var(--max);
      margin: 0 auto 10px;
      color:#8fb8ff;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding-left: 6px;
    }
  </style>
</head>

<body>
  <div class="frame">

    <div class="wrap">
      <header class="header">
        <div class="brand">
          <div class="brand-logo">C</div>
          <div class="brand-text">
            centro<br/>innovación<br/>diseño<br/>avanzado.
          </div>
        </div>

        <nav aria-label="Principal">
          <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#cinnda">CINNDA</a></li>
            <li><a href="#areas">Áreas</a></li>
            <li><a href="#contacto">Contacto</a></li>
          </ul>
        </nav>
      </header>

      <main class="grid" id="home">
        <!-- Row 1 -->
        <section class="card card--solid card--mint c1">
          <div class="card__title">Smart City</div>
        </section>

        <section class="card card--img c2" style="background-image:url('/cinnda/imgs/CINNDA LP Design.png');" aria-label="Imagen vertical"></section>

        <section class="card card--solid card--blue c3" aria-label="Bloque azul"></section>

        <section class="card card--solid card--blue c4">
          <div class="card__title">Aeroespacial</div>
        </section>

        <!-- Row 2 -->
        <section class="card card--img c5" style="background-image:url('/cinnda/imgs/CINNDA LP Design (2).png');" aria-label="Imagen izquierda"></section>

        <section class="card card--solid card--mint c6">
          <div class="card__title small">Edu</div>
        </section>

        <section class="card card--img c7" style="background-image:url('/cinnda/imgs/CINNDA LP Design (1).png');" aria-label="Imagen central"></section>

        <section class="card card--solid card--mint c8">
          <div class="card__title small">IA</div>
        </section>

        <section class="card card--img c9" style="background-image:url('/cinnda/imgs/CINNDA LP Design (4).png');" aria-label="Mapa"></section>

        <!-- Row 3 -->
        <section class="card card--img c10" style="background-image:url('/cinnda/imgs/CINNDA LP Design (3).png');" aria-label="Imagen inferior izquierda"></section>

        <section class="info c11" id="contacto">
          <div class="email">info@cinnda.org</div>
          <p>
            El Centro de Innovación y Diseño Avanzado es un laboratorio de innovación e I+D,
            que opera como un ecosistema donde convergen la creatividad, el diseño.
          </p>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
